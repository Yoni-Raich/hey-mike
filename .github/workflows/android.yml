name: Android
# Feature branches are checked through their PR, including draft PRs. Keep
# integration and tag pushes checked without building every PR head twice.
on:
  push:
    branches: [dev, main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

# Only a newer revision of the same PR may cancel a running check. Push and
# manual runs have unique groups, so integration/tag evidence is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Google removed the obsolete `tools` package from the SDK repository,
      # and this action installs its `packages` default (`tools ...`) before
      # anything else runs. An empty list skips that: the runner image already
      # ships platform-tools, and AGP fetches the platform and build-tools the
      # build asks for.
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'ndk;28.2.13676358'
      - run: chmod +x gradlew
      - run: python -m unittest tools.test_prepare_runtime tools.test_codex_runtime
      - run: python .agents/skills/repo-maintenance/scripts/test_ci_history.py
      - run: ./gradlew :web:testDebugUnitTest :core:test :engine-codex:testDebugUnitTest :engine-claude:testDebugUnitTest :mcp-loopback:testDebugUnitTest :runtime:testDebugUnitTest :workspace:testDebugUnitTest :remote:testDebugUnitTest :device-tools:testDebugUnitTest :app:testDevDebugUnitTest :app:assembleDevDebug :app:lintDevDebug
        env:
          HEYMIKE_TEST_CHROME: /usr/bin/google-chrome
