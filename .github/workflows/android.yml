name: Android
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Google removed the obsolete `tools` package from the SDK repository,
      # and this action installs its `packages` default (`tools ...`) before
      # anything else runs. An empty list skips that: the runner image already
      # ships platform-tools, and AGP fetches the platform and build-tools the
      # build asks for.
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :core:test :app:assembleDevDebug :app:lintDevDebug
