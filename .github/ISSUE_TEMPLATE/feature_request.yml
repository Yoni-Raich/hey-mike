name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: desired_result
    attributes:
      label: Desired result
      description: What should the app do, in clear user terms?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds did you try?
  - type: textarea
    id: device_privacy
    attributes:
      label: Device and privacy impact
      description: Describe any device control, permissions, network use, storage, screen access, or privacy impact.
    validations:
      required: true
